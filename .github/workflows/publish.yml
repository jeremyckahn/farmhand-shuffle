name: Publish Library

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish: "patch", "minor", "major", or an exact semver
          (e.g. 1.4.0). Passed straight through to `npm version`.
        required: true
        default: patch
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure running from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow can only be run from the main branch (was ${{ github.ref }}). Re-run it with 'main' selected as the branch."
          exit 1

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; the version
      # bundled with actions/setup-node's Node 22 can be older than that.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Run checks
        run: npm run check

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        run: |
          npm version "${{ inputs.version }}" -m "chore(release): v%s"

      - name: Push version commit and tag
        run: git push --follow-tags

      - name: Build library
        run: npm run build:lib

      - uses: actions/upload-artifact@v4
        with:
          name: library-build-output
          path: dist-lib

      # Publishes via npm Trusted Publishing (OIDC) once a trusted publisher
      # is configured for this package at
      # https://www.npmjs.com/package/@jeremyckahn/farmhand-shuffle/access
      # (org/user: jeremyckahn, repo: farmhand-shuffle, workflow: publish.yml).
      # npm tries OIDC first and only falls back to NPM_TOKEN if that secret
      # is set — see the README for the one-time setup and why the very
      # first publish still needs a token.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
